[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-studio"
version = "0.1.0"
description = "Autonomous Freelance Software Agency powered by ADK and A2A multi-agent protocols"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "google-genai>=0.1.0",
    "rich>=13.7.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
agentic-studio = "agentic_studio.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
